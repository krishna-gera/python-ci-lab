name: Python CI Pipeline with DevSecOps

on:
  push:
    branches: [ main ]

permissions:
  security-events: write
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  build:
    needs: security
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tools and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit pytest
          pip install -r requirements.txt || true

      - name: Safety dependency vulnerability scan
        run: safety check --file=requirements.txt -o sarif --output-file=safety.sarif || true
        continue-on-error: true

      - name: Bandit SAST code scan
        run: bandit -r . -f sarif -o bandit.sarif -ll HIGH -c HIGH || true
        continue-on-error: true

      - name: Upload Safety SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: safety.sarif
        continue-on-error: true

      - name: Upload Bandit SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
        continue-on-error: true

      - name: Run pytest tests
        run: pytest || true
